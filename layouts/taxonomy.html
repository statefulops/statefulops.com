{{ define "main" }}
<section class="container-narrow list-page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  <ul class="tag-cloud">
    {{ range .Data.Terms.ByCount }}
      <li><a href="{{ .Page.RelPermalink }}">#{{ .Page.LinkTitle }} <span>{{ .Count }}</span></a></li>
    {{ end }}
  </ul>
</section>
{{ end }}
