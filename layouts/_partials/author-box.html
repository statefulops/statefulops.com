{{ $a := site.Params.author }}
{{ $img := (resources.Get "images/profile.jpeg").Fill "192x192 webp q85 Top" }}
<aside class="author-box">
  <img src="{{ $img.RelPermalink }}" width="96" height="96" alt="{{ $a.name }}" loading="lazy">
  <div>
    <p class="author-name">{{ $a.name }}</p>
    <p class="author-role">{{ $a.role }}, {{ site.Title }}</p>
    <p class="author-bio">{{ $a.bio }}</p>
    <p><a class="text-link" href="{{ "contact/" | relURL }}">Work with me →</a></p>
  </div>
</aside>
